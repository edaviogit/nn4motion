[workspace]
resolver = "2"
members = ["crates/nn4motion"]
default-members = ["crates/nn4motion"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/edaviogit/nn4motion"
authors = ["NN4motion contributors"]

[workspace.dependencies]
anyhow = "1"
candle-core = "0.8.4"
candle-nn = "0.8.4"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
